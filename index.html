<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPG Clínico 3D — Método Dáder | Caso Joana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Radley:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F5F1EB;
      --cream-2: #EAE2D5;
      --teal: #174B52;
      --teal-dark: #0D2E33;
      --teal-2: #246670;
      --sage: #7FA19D;
      --lime: #8DB838;
      --lime-dark: #668821;
      --terracotta: #E07A5F;
      --ochre: #E2AD3B;
      --white: #FFFFFF;
      --ink: #163337;
      --muted: #536D71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 15% 10%, #FAF7F2 0%, var(--cream) 70%, #E7DFD2 100%);
      color: var(--ink);
      overflow: hidden;
    }

    .app-shell {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-bottom: 10px solid var(--teal);
    }

    /* TOPBAR COMPACTA */
    header {
      background: linear-gradient(180deg, #FFFFFF 0%, #FAF8F4 100%);
      border-bottom: 1.5px solid #DDD3C2;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chevron-3d {
      width: 16px;
      height: 24px;
      background: linear-gradient(135deg, #A3CE4B 0%, var(--lime) 60%, var(--lime-dark) 100%);
      clip-path: polygon(0 0, 58% 0, 100% 50%, 58% 100%, 0 100%, 42% 50%);
    }

    .brand h1 {
      font-family: "Radley", Georgia, serif;
      font-size: 1.18rem;
      color: var(--teal);
      font-weight: 400;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-pill {
      background: var(--cream);
      border: 1.5px solid #D5CBB9;
      box-shadow: 0 2px 0 #C8BCA8;
      color: var(--teal);
      font-weight: 800;
      font-size: 0.76rem;
      padding: 4px 11px;
      border-radius: 999px;
    }

    .hud-btn {
      background: linear-gradient(180deg, #FFFFFF 0%, #EEF4F4 100%);
      border: 1.5px solid var(--teal);
      box-shadow: 0 2px 0 var(--teal);
      color: var(--teal);
      font-weight: 800;
      font-size: 0.75rem;
      padding: 4px 11px;
      border-radius: 999px;
      cursor: pointer;
    }

    .hud-btn.active {
      background: linear-gradient(180deg, #A2CE49 0%, var(--lime) 100%);
      border-color: var(--lime-dark);
      box-shadow: 0 2px 0 var(--lime-dark);
      color: var(--ink);
    }

    /* STEPPER DE 7 FASES */
    .stepper {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding: 7px 18px;
      background: var(--cream-2);
      border-bottom: 1px solid #D5CBB9;
      flex-shrink: 0;
    }

    .step-tab {
      background: var(--white);
      border: 1.5px solid #D3C8B6;
      box-shadow: 0 2px 0 #C5B9A6;
      border-radius: 8px;
      padding: 5px 4px;
      text-align: center;
      font-size: 0.71rem;
      font-weight: 700;
      color: var(--muted);
    }

    .step-tab.clickable { cursor: pointer; }
    .step-tab.active {
      background: #F7FDEC;
      border-color: var(--lime);
      box-shadow: 0 2px 0 var(--lime-dark);
      color: var(--teal);
    }
    .step-tab.done {
      background: var(--teal);
      border-color: var(--teal-dark);
      box-shadow: 0 2px 0 var(--teal-dark);
      color: var(--white);
    }

    /* GRID PRINCIPAL: PALCO + AÇÕES À ESQUERDA | PRONTUÁRIO SEMPRE VISÍVEL À DIREITA */
    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.85fr 0.85fr;
      gap: 14px;
      padding: 12px 18px 14px;
    }

    @media (max-width: 960px) {
      html, body { overflow-y: auto; }
      .app-shell { height: auto; min-height: 100vh; }
      .workspace { grid-template-columns: 1fr; }
    }

    .left-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    /* CENÁRIO 3D SEMPRE VISÍVEL NO TOPO DA COLUNA ESQUERDA */
    .stage-card {
      flex: 0 0 43%;
      min-height: 215px;
      background: #E8F0EE;
      border-radius: 18px;
      border: 1.5px solid #D6CCB9;
      box-shadow: 0 8px 20px rgba(13, 46, 51, 0.09), 0 3px 0 #C8BCA8;
      position: relative;
      overflow: hidden;
    }

    .scene-tag {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 3;
      background: var(--teal);
      color: var(--white);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: 999px;
      box-shadow: 0 2px 0 var(--teal-dark);
    }

    .mood-tag {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 3;
      background: rgba(255, 255, 255, 0.94);
      border: 1.5px solid #C8D4D2;
      color: var(--teal);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
    }

    /* PAINEL DE DIÁLOGO E ESCOLHAS LOGO ABAIXO DO CENÁRIO */
    .control-card {
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, #FFFFFF 0%, #FCFBF9 100%);
      border-radius: 18px;
      border: 1.5px solid #D8CEBC;
      box-shadow: 0 8px 20px rgba(13, 46, 51, 0.08), 0 4px 0 #C9BEB0;
      padding: 13px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      overflow-y: auto;
    }

    .ctrl-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .phase-title {
      font-family: "Radley", Georgia, serif;
      font-size: 1.22rem;
      color: var(--teal);
    }

    .goal-badge {
      background: #EEF6F4;
      border: 1px dashed var(--sage);
      color: var(--teal);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .speech-bar {
      background: linear-gradient(180deg, #FAF7F2 0%, #F3EDE3 100%);
      border-left: 4px solid var(--lime);
      border-radius: 0 10px 10px 0;
      padding: 8px 12px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .speech-bar .spk {
      font-weight: 800;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--teal);
      margin-right: 5px;
    }

    .options-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    @media (max-width: 780px) {
      .options-2col { grid-template-columns: 1fr; }
    }

    .arc-btn {
      text-align: left;
      background: linear-gradient(180deg, #FFFFFF 0%, #F6F9F8 100%);
      border: 1.5px solid #C4D2D0;
      box-shadow: 0 3px 0 #B3C2C0;
      border-radius: 11px;
      padding: 8px 11px;
      font-family: inherit;
      font-size: 0.8rem;
      line-height: 1.33;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.15s ease;
    }

    .arc-btn:hover:not(:disabled) {
      border-color: var(--teal);
      transform: translateY(-1px);
      box-shadow: 0 4px 0 #9BB0AD;
    }

    .arc-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #9BB0AD;
    }

    .arc-btn.done {
      background: linear-gradient(180deg, #F7FDEB 0%, #EAF6D3 100%);
      border-color: var(--lime);
      box-shadow: 0 3px 0 var(--lime-dark);
      color: var(--teal);
      font-weight: 600;
    }

    .arc-btn:disabled {
      opacity: 0.52;
      cursor: not-allowed;
      background: #F3EFE7;
      box-shadow: 0 2px 0 #D6CDBD;
    }

    .tag-mini {
      font-size: 0.67rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: #E4ECEB;
      color: var(--teal);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .arc-btn.done .tag-mini {
      background: var(--lime);
      color: var(--white);
    }

    .ctrl-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toast-bar {
      flex: 1;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 9px;
      min-height: 32px;
      display: flex;
      align-items: center;
    }

    .toast-ok { background: #ECF7E2; border: 1px solid var(--lime); color: #1B431E; }
    .toast-err { background: #FDEFEB; border: 1px solid var(--terracotta); color: #7C2A17; }
    .toast-neutral { background: #F4F0E8; border: 1px solid #DFD6C7; color: var(--muted); }

    .next-3d {
      background: linear-gradient(180deg, #246670 0%, var(--teal) 100%);
      color: var(--white);
      border: 1.5px solid var(--teal-dark);
      box-shadow: 0 3px 0 var(--teal-dark);
      border-radius: 10px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .next-3d:disabled {
      background: #B9C7C9;
      border-color: #9FB0B2;
      box-shadow: 0 2px 0 #8E9FA1;
      cursor: not-allowed;
    }

    /* COLUNA DIREITA: PRONTUÁRIO DE PISTAS SEMPRE VISÍVEL */
    .dossier-card {
      background: linear-gradient(180deg, #FFFFFF 0%, #FCFBF9 100%);
      border-radius: 18px;
      border: 1.5px solid #D8CEBC;
      box-shadow: 0 8px 20px rgba(13, 46, 51, 0.08), 0 4px 0 #C9BEB0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .dossier-head {
      background: linear-gradient(180deg, #22616B 0%, var(--teal) 100%);
      color: var(--white);
      padding: 11px 15px;
      font-family: "Radley", Georgia, serif;
      font-size: 1.06rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--teal-dark);
      flex-shrink: 0;
    }

    .dossier-list {
      padding: 11px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .clue-item {
      background: linear-gradient(180deg, #FAF7F2 0%, var(--cream) 100%);
      border-left: 4px solid var(--sage);
      border-top: 1px solid #EAE2D5;
      border-right: 1px solid #EAE2D5;
      border-bottom: 1px solid #DDD3C2;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 0.79rem;
      line-height: 1.36;
    }

    .clue-item strong { display: block; color: var(--teal); margin-bottom: 1px; }
    .clue-item.rnm { border-left-color: var(--terracotta); background: #FDF3F0; }
    .clue-item.win { border-left-color: var(--lime); background: #F3FAEA; }

    .empty-dossier {
      color: var(--muted);
      font-size: 0.81rem;
      text-align: center;
      padding: 24px 12px;
      line-height: 1.45;
    }

    /* COMPONENTES COMPACTOS (ETAPAS 3 E 5) */
    .state-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .mini-row {
      background: #FAF7F2;
      border: 1px solid #DCD2C1;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 0.79rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    select.sel-3d {
      padding: 4px 7px;
      border-radius: 7px;
      border: 1.5px solid var(--sage);
      font-weight: 700;
      color: var(--teal);
      background: #FFFFFF;
      font-size: 0.78rem;
    }

    .algo-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #FAF7F2;
      border: 1.5px solid #D7CCBA;
      border-radius: 11px;
      padding: 9px 13px;
      flex-wrap: wrap;
    }

    .yn-group { display: flex; gap: 8px; }
    .yn-btn {
      padding: 7px 18px;
      border-radius: 9px;
      border: 1.5px solid var(--teal);
      background: #FFFFFF;
      box-shadow: 0 3px 0 var(--teal);
      color: var(--teal);
      font-weight: 800;
      cursor: pointer;
    }
    .yn-btn:hover { background: var(--teal); color: var(--white); }

    /* ANIMAÇÕES SEGURAS PARA SVG (SEM SOBRESCREVER TRANSLATE EXTERNO) */
    @keyframes breathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes fadeInChar {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes fadeOutChar {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .anim-breathe { animation: breathe 3s ease-in-out infinite; }
    .anim-float { animation: floatIcon 2.5s ease-in-out infinite; }
    .char-fade-in { animation: fadeInChar 0.45s ease forwards; }
    .char-fade-out { animation: fadeOutChar 0.45s ease forwards; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- TOPO -->
    <header>
      <div class="brand">
        <div class="chevron-3d"></div>
        <h1>RPG Clínico 3D — Método Dáder • Caso Joana (30 anos)</h1>
      </div>
      <div class="hud-right">
        <div class="hud-pill">Precisão: <span id="hudScore">100</span>%</div>
        <button type="button" class="hud-btn" id="freeBtn" onclick="toggleFree()">Modo Aula Livre: OFF</button>
      </div>
    </header>

    <!-- BARRA DE ETAPAS -->
    <nav class="stepper" id="stepper"></nav>

    <!-- ÁREA DE TRABALHO: ESQUERDA (CENÁRIO + AÇÕES) | DIREITA (PRONTUÁRIO) -->
    <main class="workspace">
      <div class="left-column">
        <section class="stage-card" id="stageCard"></section>
        <section class="control-card" id="controlCard"></section>
      </div>

      <aside class="dossier-card">
        <div class="dossier-head">
          <span>📋 Prontuário de Pistas</span>
          <small style="font-family:inherit; font-weight:700; opacity:0.9;"><span id="hudClues">0</span>/9 pistas</small>
        </div>
        <div class="dossier-list" id="dossierList">
          <div class="empty-dossier">As pistas clínicas coletadas com Joana e os registros do Método Dáder aparecerão aqui em tempo real.</div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const STEPS = [
      "1. Oferta (Balcão)",
      "2. 1ª Entrevista",
      "3. Estado Situação",
      "4. Fase de Estudo",
      "5. Avaliação RNM",
      "6. Plano Atuação",
      "7. Retorno (6 sem.)"
    ];

    const state = {
      step: 0,
      score: 100,
      free: false,
      clues: [],
      toast: { text: "Clique nas ações abaixo para conduzir o atendimento.", kind: "neutral" },
      joanaLeaving: false,
      p1Box: false,
      p1Offer: false,
      p2Symp: false,
      p2Meds: false,
      p2How: false,
      p2Adh: false,
      p3Ok: false,
      p4Mech: false,
      p4Time: false,
      p5Idx: 0,
      p5Done: false,
      p6Goal: false,
      p6Plan: false,
      p6Sheet: false,
      p7Done: false
    };

    function toggleFree() {
      state.free = !state.free;
      const btn = document.getElementById("freeBtn");
      btn.textContent = "Modo Aula Livre: " + (state.free ? "ON" : "OFF");
      btn.classList.toggle("active", state.free);
      render();
    }

    function addClue(id, title, text, kind) {
      if (state.clues.some(function (c) { return c.id === id; })) return;
      state.clues.push({ id: id, title: title, text: text, kind: kind || "base" });
      renderDossier();
    }

    function setToast(text, kind) {
      state.toast = { text: text, kind: kind };
      render();
    }

    function failAction(pts, text) {
      state.score = Math.max(50, state.score - pts);
      setToast(text, "err");
    }

    function renderDossier() {
      document.getElementById("hudScore").textContent = state.score;
      document.getElementById("hudClues").textContent = state.clues.length;
      const list = document.getElementById("dossierList");
      if (!state.clues.length) return;
      list.innerHTML = state.clues.map(function (c) {
        const cls = c.kind === "rnm" ? " rnm" : (c.kind === "win" ? " win" : "");
        return '<div class="clue-item' + cls + '"><strong>' + c.title + '</strong><span>' + c.text + '</span></div>';
      }).join("");
    }

    function renderStepper() {
      const nav = document.getElementById("stepper");
      nav.innerHTML = STEPS.map(function (label, idx) {
        let cls = "step-tab";
        if (idx < state.step) cls += " done";
        else if (idx === state.step) cls += " active";
        if (state.free) cls += " clickable";
        const fn = state.free ? ' onclick="jumpTo(' + idx + ')"' : '';
        return '<div class="' + cls + '"' + fn + '>' + label + '</div>';
      }).join("");
    }

    function jumpTo(idx) {
      if (!state.free) return;
      state.step = idx;
      state.joanaLeaving = false;
      state.toast = { text: "Navegação livre ativada.", kind: "neutral" };
      render();
    }

    function renderStage() {
      const card = document.getElementById("stageCard");
      const fadeCls = state.joanaLeaving ? "char-fade-out" : "char-fade-in";

      function buildJoana(x, y, mood, shirt, shade, hasBox) {
        let mouth = '<path d="M-8 14 Q0 9 8 14" stroke="#7E4438" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
        if (mood === "neutral") {
          mouth = '<path d="M-7 13 Q0 11 7 13" stroke="#7E4438" stroke-width="2.3" fill="none" stroke-linecap="round"/>';
        } else if (mood === "happy") {
          mouth = '<path d="M-9 12 Q0 21 9 12" stroke="#174B52" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
        }

        const boxSvg = hasBox
          ? '<g transform="translate(30, 36)"><polygon points="0,7 30,0 40,6 10,13" fill="#FFFFFF" stroke="#174B52" stroke-width="1.5"/><polygon points="0,7 10,13 10,31 0,25" fill="#8DB838" stroke="#174B52" stroke-width="1.5"/><polygon points="10,13 40,6 40,24 10,31" fill="#F2EFE8" stroke="#174B52" stroke-width="1.5"/></g>'
          : '';

        return (
          '<g transform="translate(' + x + ',' + y + ')">' +
            '<g class="' + fadeCls + '">' +
              '<g class="anim-breathe">' +
                '<ellipse cx="0" cy="100" rx="46" ry="9" fill="#0D2E33" opacity="0.22"/>' +
                '<path d="M-34 -2 Q-30 -44 0 -44 Q30 -44 34 -2 L40 44 L-40 44 Z" fill="#2B1F20"/>' +
                '<path d="M-38 96 Q-30 34 0 34 Q30 34 38 96 Z" fill="' + shirt + '"/>' +
                '<path d="M0 34 Q30 34 38 96 L12 96 Q10 56 0 34 Z" fill="' + shade + '" opacity="0.5"/>' +
                '<circle cx="0" cy="-2" r="25" fill="url(#skinJ)"/>' +
                '<path d="M12 -22 A25 25 0 0 1 12 18 Q25 -2 12 -22 Z" fill="#C98D75" opacity="0.28"/>' +
                '<circle cx="-8" cy="-5" r="2.9" fill="#174B52"/>' +
                '<circle cx="8" cy="-5" r="2.9" fill="#174B52"/>' +
                '<circle cx="-9" cy="-6" r="1" fill="#FFFFFF"/>' +
                '<circle cx="7" cy="-6" r="1" fill="#FFFFFF"/>' +
                mouth +
                boxSvg +
              '</g>' +
            '</g>' +
          '</g>'
        );
      }

      function buildPharma(x, y, studying) {
        const bookSvg = studying
          ? '<g transform="translate(-44, 34)"><polygon points="0,11 42,2 84,11 42,20" fill="#FFFFFF" stroke="#174B52" stroke-width="1.8"/><line x1="42" y1="2" x2="42" y2="20" stroke="#8DB838" stroke-width="2.5"/><path d="M8 9 Q24 5 38 10" stroke="#7FA19D" stroke-width="1.5" fill="none"/><path d="M46 10 Q62 5 76 9" stroke="#7FA19D" stroke-width="1.5" fill="none"/></g>'
          : '';
        return (
          '<g transform="translate(' + x + ',' + y + ')">' +
            '<g class="anim-breathe">' +
              '<ellipse cx="0" cy="100" rx="46" ry="9" fill="#0D2E33" opacity="0.22"/>' +
              '<path d="M-28 -10 Q-24 -40 0 -40 Q24 -40 28 -10 Z" fill="#172427"/>' +

        html += '</div>';
      }

      const toastCls = state.toast.kind === "ok" ? "toast-ok" : (state.toast.kind === "err" ? "toast-err" : "toast-neutral");
      html += '<div class="ctrl-bottom">';
      html += '<div class="toast-bar ' + toastCls + '">' + state.toast.text + '</div>';
      if (state.step < 6) {
        html += '<button type="button" class="next-3d"' + (!canAdvance() ? ' disabled' : '') + ' onclick="advanceStep()">Avançar Etapa →</button>';
      }
      html += '</div>';

      ctrl.innerHTML = html;
    }

    function render() {
      renderStepper();
      renderStage();
      renderControl();
      renderDossier();
    }

    function advanceStep() {
      if (!canAdvance()) return;
      if (state.step === 0 || state.step === 5) {
        state.joanaLeaving = true;
        renderStage();
        setTimeout(function () {
          state.joanaLeaving = false;
          state.step++;
          state.toast = { text: "Etapa avançada! Continue a condução clínica.", kind: "neutral" };
          render();
        }, 420);
      } else {
        state.step++;
        state.toast = { text: "Etapa avançada! Continue a condução clínica.", kind: "neutral" };
        render();
      }
    }

    function actP1Box() {
      state.p1Box = true;
      addClue("c1", "Queixa no Balcão", "Levotiroxina 50 mcg com nova embalagem; relata fadiga, sonolência e TSH elevado.");
      setToast("✓ Você tranquilizou Joana sobre a embalagem e acolheu os sintomas para investigação.", "ok");
    }

    function actP1Offer() {
      state.p1Offer = true;
      addClue("c2", "Oferta do Serviço", "Joana aceitou o Seguimento Farmacoterapêutico em consultório.");
      setToast("✓ Ótimo! Clique em 'Avançar Etapa' para acompanhar Joana até o consultório.", "ok");
    }

    function actP1Wrong() {
      failAction(5, "⚠️ Dispensar sem investigar pode gerar aumento desnecessário da dose de levotiroxina.");
    }

    function actP2Symp() {
      state.p2Symp = true;
      addClue("c3", "Parâmetros Clínicos", "Fadiga intensa e sonolência há ~2 meses; TSH = 8,4 mUI/L.");
      setToast("✓ Pista desbloqueada: sintomas e TSH elevado surgiram há cerca de 2 meses.", "ok");
    }

    function actP2Meds() {
      state.p2Meds = true;
      addClue("c4", "Medicamento Adicional", "Usa Omeprazol 20 mg/dia há 2 meses para gastrite.");
      setToast("✓ Descoberta-chave: Joana iniciou Omeprazol 20 mg há 2 meses para gastrite!", "ok");
    }

    function actP2How() {
      state.p2How = true;
      addClue("c5", "Rotina de Uso", "Toma Levotiroxina 50 mcg e Omeprazol 20 mg juntos, no mesmo instante, em jejum pela manhã.");
      setToast("✓ Interação detectada: ingestão simultânea em jejum pela manhã sem intervalo.", "ok");
    }

    function actP2Adh() {
      state.p2Adh = true;
      addClue("c6", "Adesão", "Adesão diária regular, sem esquecimentos.");
      setToast("✓ Adesão confirmada: não há falha por esquecimento de doses.", "ok");
    }

    function actP3() {
      const h = document.getElementById("selH").value;
      const g = document.getElementById("selG").value;
      if (h === "no" && g === "ok") {
        state.p3Ok = true;
        setToast("✓ Estado de Situação validado: Hipotireoidismo não controlado e Gastrite controlada.", "ok");
      } else {
        failAction(5, "⚠️ Revise: Hipotireoidismo está não controlado (TSH 8,4 + sintomas) e Gastrite está controlada.");
      }
    }

    function actP4Mech() {
      state.p4Mech = true;
      addClue("c7", "Evidência Farmacocinética", "Omeprazol eleva o pH gástrico e reduz a dissolução/absorção da levotiroxina.");
      setToast("✓ Evidência confirmada: o aumento do pH gástrico reduz a biodisponibilidade da levotiroxina.", "ok");
    }

    function actP4Time() {
      state.p4Time = true;
      setToast("✓ Manejo confirmado: Levotiroxina em jejum ao acordar, aguardar ~45 minutos e administrar o Omeprazol.", "ok");
    }

    function actP5(ans) {
      const key = ["sim", "nao", "nao", "sim", "sim"];
      const okMsg = [
        "Correto! Hipotireoidismo confirmado exige levotiroxina.",
        "Correto! TSH 8,4 mUI/L e fadiga indicam inefetividade.",
        "Correto! Ocorre por interação na absorção → RNM: Inefetividade não quantitativa!",
        "Correto! Não há sinais de excesso ou toxicidade.",
        "Correto! Gastrite controlada e sem eventos adversos."
      ];
      const errMsg = [
        "Revise: o hipotireoidismo confirmado exige reposição hormonal.",
        "Revise: TSH alto e sintomas mostram que não está efetivo.",
        "Revise: não é erro de dose prescrita, mas interação na absorção (Inefetividade não quantitativa).",
        "Revise: não há sinais de insegurança na dose atual.",
        "Revise: a gastrite está assintomática e controlada."
      ];
      if (ans === key[state.p5Idx]) {
        const msg = okMsg[state.p5Idx];
        if (state.p5Idx === 2) {
          addClue("c8", "RNM Identificado", "Inefetividade não quantitativa da Levotiroxina 50 mcg por interação com Omeprazol 20 mg.", "rnm");
        }
        state.p5Idx++;
        if (state.p5Idx >= key.length) state.p5Done = true;
        setToast("✓ " + msg, "ok");
      } else {
        failAction(5, "⚠️ " + errMsg[state.p5Idx]);
      }
    }

    function actP6Goal() {
      state.p6Goal = true;
      setToast("✓ Objetivos definidos e hierarquizados.", "ok");
    }

    function actP6Plan() {
      state.p6Plan = true;
      setToast("✓ Pactuado com Joana: Levotiroxina em jejum ao acordar, aguardar ~45 minutos e tomar o Omeprazol.", "ok");
    }

    function actP6Wrong() {
      failAction(5, "⚠️ Não é necessário suspender o omeprazol; basta manter o intervalo de ~45 minutos pela manhã.");
    }

    function actP6Sheet() {
      state.p6Sheet = true;
      setToast("✓ Folha de Intervenção preenchida corretamente com um único RNM.", "ok");
    }

    function actP7() {
      state.p7Done = true;
      addClue("c9", "Desfecho (6 Semanas)", "RNM resolvido! Sem fadiga/sonolência; TSH normalizado (8,4 → 2,3 mUI/L).", "win");
      setToast("🎉 Caso finalizado com êxito! Todos os registros do Método Dáder concluídos.", "ok");
    }

    render();
  </script>
</body>
</html>
